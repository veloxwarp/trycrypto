[package]
name = "trycrypto"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An interactive introduction to practical cryptography"

[dependencies]
hex = "0.4"
js-sys = "0.3.103"
leptos = { version = "0.8.20", features = ["csr"] }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Crypto",
    "SubtleCrypto",
    "Window",
] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
